<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            color: white;
            font-family: 'Arial', sans-serif;
            flex-direction: column;
        }

        canvas {
            border: 5px solid #ecf0f1;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #000;
            display: block;
        }

        .score-board {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .instructions {
            margin-top: 15px;
            color: #bdc3c7;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 10px;
            z-index: 10;
        }

        .btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            transition: background 0.2s;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.4);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

    <div class="score-board">Score: <span id="score">0</span></div>
    <canvas id="snakeGame" width="800" height="800"></canvas>
    <div class="instructions">Use Arrow Keys to Move</div>
    <div class="controls">
        <button class="btn btn-up" onclick="setDirection('UP')">↑</button>
        <button class="btn btn-left" onclick="setDirection('LEFT')">←</button>
        <button class="btn btn-right" onclick="setDirection('RIGHT')">→</button>
        <button class="btn btn-down" onclick="setDirection('DOWN')">↓</button>
    </div>

    <script>
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const box = 20;
        let score = 0;
        let gameSpeed = 100;

        // Sound effect
        const eatSound = new Audio('allu arjun laugh.mp3.mpeg');

        // Initialize Snake
        let snake = [];
        snake[0] = { x: 20 * box, y: 20 * box };

        // Initialize Assets
        const foodImg = new Image();
        foodImg.src = 'Screenshot 2026-09-27 163420.png';
        const headImg = new Image();
        headImg.src = 'aa.jpg';

        let food = {
            x: Math.floor(Math.random() * 39 + 1) * box,
            y: Math.floor(Math.random() * 39 + 1) * box
        };

        let d; // Direction

        document.addEventListener("keydown", direction);

        function direction(event) {
            let key = event.keyCode;
            if(key == 37 && d != "RIGHT") setDirection("LEFT");
            else if(key == 38 && d != "DOWN") setDirection("UP");
            else if(key == 39 && d != "LEFT") setDirection("RIGHT");
            else if(key == 40 && d != "UP") setDirection("DOWN");
        }

        function setDirection(dir) {
            if(dir == "LEFT" && d != "RIGHT") d = "LEFT";
            else if(dir == "UP" && d != "DOWN") d = "UP";
            else if(dir == "RIGHT" && d != "LEFT") d = "RIGHT";
            else if(dir == "DOWN" && d != "UP") d = "DOWN";
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Snake
            for (let i = 0; i < snake.length; i++) {
                if (i == 0) {
                    const headSize = box * 1.2;
                    const offset = (headSize - box) / 2;
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(snake[i].x + box / 2, snake[i].y + box / 2, headSize / 2, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(headImg, snake[i].x - offset, snake[i].y - offset, headSize, headSize);
                    ctx.restore();
                } else {
                    ctx.fillStyle = "#27ae60";
                    ctx.fillRect(snake[i].x, snake[i].y, box, box);
                    ctx.strokeStyle = "black";
                    ctx.strokeRect(snake[i].x, snake[i].y, box, box);
                }
            }

            // Draw Food
            if (food) {
                const foodSize = box * 2.5;
                const offset = (foodSize - box) / 2;
                ctx.save();
                ctx.beginPath();
                ctx.arc(food.x + box / 2, food.y + box / 2, foodSize / 2, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(foodImg, food.x - offset, food.y - offset, foodSize, foodSize);
                ctx.restore();
            }

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (d == "LEFT") snakeX -= box;
            else if (d == "UP") snakeY -= box;
            else if (d == "RIGHT") snakeX += box;
            else if (d == "DOWN") snakeY += box;

            if (snakeX == food.x && snakeY == food.y) {
                score++;
                scoreElement.innerHTML = score;
                eatSound.currentTime = 0;
                eatSound.play().catch(() => {});
                food = {
                    x: Math.floor(Math.random() * 39 + 1) * box,
                    y: Math.floor(Math.random() * 39 + 1) * box
                };
            } else if (d !== "") {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(game);
                alert("Game Over! Score: " + score);
                location.reload();
            }

            if (d !== "") {
                snake.unshift(newHead);
            }
        }

        let game = setInterval(draw, gameSpeed);
    </script>
</body>
</html>
